<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ЦОКОЛЬ Lounge | Шахматка зала</title>

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #12141a;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.14);
      --accent: #d62839;
      --accent-soft: rgba(214, 40, 57, 0.15);
      --green: #2ecc71;
      --green-soft: rgba(46, 204, 113, 0.15);
      --gold: #d4af37;
      --blue: #3498db;
      --text: #f4f5f7;
      --text-muted: #7b808e;
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    html, body { width: 100%; max-width: 100vw; overflow-x: hidden; }
    body { background: var(--bg); color: var(--text); padding-bottom: 50px; }
    .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 14px 14px 40px; }

    .pin-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .pin-card {
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 20px; padding: 26px 20px; max-width: 340px; width: 100%; text-align: center;
    }
    .pin-card h2 { font-size: 17px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .pin-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 16px; }
    .pin-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 12px; color: #fff; font-size: 15px; text-align: center; outline: none; margin-bottom: 12px;
    }
    .pin-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 13px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; text-transform: uppercase;
    }
    .pin-error { font-size: 11px; color: var(--accent); margin-top: 8px; display: none; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .admin-header h1 { font-size: 17px; font-weight: 800; text-transform: uppercase; }
    .admin-header h1 span { color: var(--accent); }
    .head-actions { display: flex; gap: 6px; align-items: center; }
    .hdr-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-muted); padding: 7px 10px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: 600; }
    .hdr-btn-danger { color: #f19fa7; border-color: rgba(214, 40, 57, 0.3); }

    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }

    .dates-scroll, .slots-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 14px; scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .dates-scroll::-webkit-scrollbar, .slots-scroll::-webkit-scrollbar { display: none; }

    .date-pill, .slot-pill {
      background: var(--surface); border: 1px solid var(--border);
      padding: 9px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      color: var(--text-muted); white-space: nowrap; flex-shrink: 0; cursor: pointer;
    }
    .date-pill.active, .slot-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

    .tables-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 22px; }
    .table-admin-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; display: flex;
      justify-content: space-between; align-items: center;
    }
    .table-admin-card.busy { border-color: rgba(214, 40, 57, 0.4); background: rgba(214, 40, 57, 0.04); }
    .table-admin-card.buffer { border-color: rgba(241, 196, 15, 0.4); background: rgba(241, 196, 15, 0.04); }
    .table-info h4 { font-size: 13px; font-weight: 700; color: #fff; }
    .table-info p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    .table-actions { display: flex; gap: 6px; align-items: center; }
    .status-toggle-btn {
      padding: 9px 12px; border-radius: 8px; font-size: 11px; font-weight: 700;
      text-transform: uppercase; cursor: pointer; border: none; min-width: 105px; text-align: center;
    }
    .btn-free { background: var(--green-soft); color: var(--green); border: 1px solid rgba(46, 204, 113, 0.3); }
    .btn-busy { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(214, 40, 57, 0.4); }
    .btn-buffer { background: rgba(241, 196, 15, 0.15); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.4); }
    .release-btn {
      background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border-light);
      color: var(--gold); padding: 9px 10px; border-radius: 8px; font-size: 10px; font-weight: 700; cursor: pointer;
    }

    .action-btn-main {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 13px; border-radius: 10px; font-size: 12px; font-weight: 700;
      text-transform: uppercase; cursor: pointer; margin-bottom: 20px;
    }

    /* Журнал */
    .bookings-box { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .booking-feed-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 12px 14px; display: flex; flex-direction: column; gap: 6px;
    }
    .bfc-head { display: flex; justify-content: space-between; align-items: center; font-size: 13px; font-weight: 700; }
    .bfc-sub { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .bfc-foot { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; padding-top: 6px; border-top: 1px solid var(--border); font-size: 11px; }
    
    .b-badge { padding: 3px 6px; border-radius: 4px; font-size: 9px; font-weight: 800; text-transform: uppercase; }
    .badge-pending { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .badge-confirmed { background: var(--green-soft); color: var(--green); }
    .badge-seated { background: rgba(52, 152, 219, 0.15); color: var(--blue); }
    .badge-completed { background: rgba(255, 255, 255, 0.08); color: #888; }
    .badge-rejected { background: rgba(214, 40, 57, 0.15); color: var(--accent); }

    .bfc-actions-bar {
      display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--border);
    }
    .bf-act-btn {
      flex: 1; min-width: 100px; padding: 8px 6px; border-radius: 6px; font-size: 10px; font-weight: 700;
      cursor: pointer; border: 1px solid var(--border-light); background: var(--bg); color: #fff;
      text-align: center; text-transform: uppercase;
    }
    .bf-btn-seat { border-color: rgba(52, 152, 219, 0.5); color: var(--blue); }
    .bf-btn-extend { border-color: rgba(241, 196, 15, 0.5); color: var(--gold); }
    .bf-btn-finish { border-color: rgba(46, 204, 113, 0.6); color: var(--green); }
    .bf-btn-cancel { border-color: rgba(214, 40, 57, 0.4); color: var(--accent); }

    /* Модалки */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 16px;
    }
    .modal-box {
      background: #14161f; border: 1px solid var(--border-light); border-radius: 16px;
      padding: 20px; max-width: 360px; width: 100%;
    }
    .modal-box h3 { font-size: 15px; font-weight: 800; text-transform: uppercase; margin-bottom: 12px; }
    .form-group { margin-bottom: 10px; }
    .form-group label { font-size: 10px; text-transform: uppercase; color: var(--text-muted); display: block; margin-bottom: 3px; font-weight: 700; }
    .form-group input, .form-group select {
      width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 11px 12px; color: #fff; font-size: 14px; outline: none;
    }
    .modal-actions { display: flex; gap: 8px; margin-top: 14px; }
    .modal-actions button { flex: 1; padding: 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; }
  </style>
</head>
<body>

  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-card">
      <div style="font-size: 26px; margin-bottom: 10px;">🔒</div>
      <h2>ЦОКОЛЬ Admin</h2>
      <p>Пароль смены для доступа к шахматке зала</p>
      <input type="password" id="pinInput" class="pin-input" placeholder="Пароль администратора" autofocus>
      <button class="pin-btn" onclick="checkPin()">Войти в панель</button>
      <div class="pin-error" id="pinError">Неверный пароль администратора</div>
    </div>
  </div>

  <div class="container" id="adminApp" style="display: none;">
    <div class="admin-header">
      <div>
        <h1>ЦОКОЛЬ<span>.</span> Шахматка</h1>
        <div style="font-size: 11px; color: var(--green);">● Смена открыта</div>
      </div>
      <div class="head-actions">
        <button class="hdr-btn" onclick="syncEverything()">Обновить ↺</button>
        <button class="hdr-btn hdr-btn-danger" onclick="clearLegacyTests()">🧹 Очистить</button>
        <button class="hdr-btn" onclick="logout()">Выход</button>
      </div>
    </div>

    <button class="action-btn-main" onclick="openManualBookingModal()">➕ Записать гостя по звонку</button>

    <div class="section-title">
      <span>1. Дата календаря</span>
      <span id="currentDateLabel" style="color: var(--accent); font-weight: 800;">Сегодня</span>
    </div>
    <div class="dates-scroll" id="adminDatesContainer"></div>

    <div class="section-title">
      <span>2. Слот времени (1.5 ч)</span>
      <span id="currentSlotLabel" style="color: var(--accent); font-weight: 800;">18:00</span>
    </div>
    <div class="slots-scroll" id="slotsContainer"></div>

    <div class="section-title">
      <span>3. Состояние столов на слот</span>
    </div>
    <div class="tables-grid" id="tablesContainer"></div>

    <div class="section-title">
      <span>4. Журнал броней на день</span>
      <span id="bookingsCountBadge" style="color: var(--gold); font-size: 11px; font-weight: 700;">0 броней</span>
    </div>
    <div class="bookings-box" id="bookingsFeed">
      <div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px;">Записей нет</div>
    </div>
  </div>

  <!-- Модалка ручной брони -->
  <div class="modal-overlay" id="manualBookingModal">
    <div class="modal-box">
      <h3>Запись по звонку</h3>
      <div class="form-group">
        <label>Имя гостя *</label>
        <input type="text" id="manName" placeholder="Иван">
      </div>
      <div class="form-group">
        <label>Телефон *</label>
        <input type="tel" id="manPhone" placeholder="+7 9XX XXX-XX-XX">
      </div>
      <div class="form-group">
        <label>Стол</label>
        <select id="manTable"></select>
      </div>
      <div class="form-group">
        <label>Время начала</label>
        <select id="manTime"></select>
      </div>
      <div class="modal-actions">
        <button style="background: var(--surface); color: var(--text-muted);" onclick="document.getElementById('manualBookingModal').style.display='none'">Отмена</button>
        <button style="background: var(--accent); color: #fff;" onclick="submitManualBooking()">Записать</button>
      </div>
    </div>
  </div>

  <!-- Калькулятор закрытия счёта -->
  <div class="modal-overlay" id="closeVisitModal">
    <div class="modal-box">
      <h3>Расчёт и закрытие счёта</h3>
      <p id="closeVisitGuestDesc" style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px;"></p>
      <div class="form-group">
        <label>Сумма чека к оплате (₽) *</label>
        <input type="number" id="closeVisitTotalInput" placeholder="1500">
      </div>
      <div class="modal-actions">
        <button style="background: var(--surface); color: var(--text-muted);" onclick="document.getElementById('closeVisitModal').style.display='none'">Отмена</button>
        <button style="background: var(--green); color: #fff;" onclick="submitCloseVisit()">🏁 Рассчитать</button>
      </div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "tcklbel723daqw";
    const API_BASE = "http://localhost:8000";

    const tableDefs = [
      { id: 'vip1', name: 'VIP 1 Малая', desc: 'PS5 • До 4 чел' },
      { id: 'vip2', name: 'VIP 2 Большая', desc: 'PS5 • До 8 чел' },
      { id: 't1', name: 'Стол №1', desc: 'Красный диван + 2 стула' },
      { id: 't2', name: 'Стол №2', desc: 'Центр зала' },
      { id: 't3', name: 'Стол №3', desc: 'Уютный угол' },
      { id: 't4', name: 'Стол №4', desc: 'Перед экраном' },
      { id: 't5', name: 'Стол №5', desc: 'Большой стол' },
      { id: 't6', name: 'Стол №6', desc: 'Зона у бара' }
    ];

    const timeSlots = [
      '12:00', '12:30', '13:00', '13:30', '14:00', '14:30',
      '15:00', '15:30', '16:00', '16:30', '17:00', '17:30',
      '18:00', '18:30', '19:00', '19:30', '20:00', '20:30',
      '21:00', '21:30', '22:00', '22:30', '23:00', '23:30',
      '00:00', '00:30', '01:00'
    ];

    let currentSelectedDateIso = '';
    let currentSelectedSlot = '18:00';
    let activeClosingBooking = null;

    function checkPin() {
      if (document.getElementById('pinInput').value.trim() === ADMIN_PIN) {
        sessionStorage.setItem('cokol_admin_auth', 'ok');
        document.getElementById('pinOverlay').style.display = 'none';
        document.getElementById('adminApp').style.display = 'block';
        initAdminPanel();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }
    document.getElementById('pinInput').addEventListener('keyup', (e) => { if (e.key === 'Enter') checkPin(); });

    function logout() { sessionStorage.removeItem('cokol_admin_auth'); location.reload(); }
    if (sessionStorage.getItem('cokol_admin_auth') === 'ok') {
      document.getElementById('pinOverlay').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      window.onload = initAdminPanel;
    }

    function initAdminPanel() {
      renderDates();
      renderSlotPills();
      populateManualModal();
      syncEverything();
    }

    function renderDates() {
      const container = document.getElementById('adminDatesContainer');
      container.innerHTML = '';
      const now = new Date();
      for (let i = 0; i < 14; i++) {
        const d = new Date();
        d.setDate(now.getDate() + i);
        const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
        const label = i === 0 ? 'Сегодня' : `${d.getDate()} окт`;
        const pill = document.createElement('div');
        pill.className = `date-pill ${i === 0 ? 'active' : ''}`;
        pill.innerText = label;
        pill.onclick = () => {
          document.querySelectorAll('.date-pill').forEach(p => p.classList.remove('active'));
          pill.classList.add('active');
          currentSelectedDateIso = iso;
          document.getElementById('currentDateLabel').innerText = label;
          syncEverything();
        };
        container.appendChild(pill);
        if (i === 0) currentSelectedDateIso = iso;
      }
    }

    function renderSlotPills() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      timeSlots.forEach(t => {
        const btn = document.createElement('div');
        btn.className = `slot-pill ${t === currentSelectedSlot ? 'active' : ''}`;
        btn.innerText = t;
        btn.onclick = () => {
          currentSelectedSlot = t;
          document.getElementById('currentSlotLabel').innerText = t;
          renderSlotPills();
          renderTablesGrid();
        };
        container.appendChild(btn);
      });
    }

    function getLocalSchedule(dateIso) {
      try { return JSON.parse(localStorage.getItem('cokol_sched_' + dateIso)) || {}; }
      catch (e) { return {}; }
    }

    function getAdminTableStatus(tableId, dateIso, time) {
      const sched = getLocalSchedule(dateIso);
      const idx = timeSlots.indexOf(time);
      if (idx === -1) return { state: 'free', label: '🟢 СВОБОДЕН' };
      if (sched[time]?.[tableId] === 'busy') return { state: 'busy', label: '🔴 ЗАНЯТ' };
      const next30 = timeSlots[idx + 1];
      if (next30 && sched[next30]?.[tableId] === 'busy') return { state: 'buffer', label: '🔴 ЗАНЯТ (окно 30м)' };
      return { state: 'free', label: '🟢 СВОБОДЕН' };
    }

    function renderTablesGrid() {
      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';
      tableDefs.forEach(tbl => {
        const info = getAdminTableStatus(tbl.id, currentSelectedDateIso, currentSelectedSlot);
        const card = document.createElement('div');
        card.className = `table-admin-card ${info.state === 'busy' ? 'busy' : (info.state === 'buffer' ? 'buffer' : '')}`;
        card.innerHTML = `
          <div class="table-info">
            <h4>${tbl.name}</h4>
            <p>${info.state === 'buffer' ? '⚠️ Окно 30 мин перед бронью' : tbl.desc}</p>
          </div>
          <div class="table-actions">
            ${info.state === 'busy' ? `<button class="release-btn" onclick="releaseTableEarly('${tbl.id}')">Освободить</button>` : ''}
            <button class="status-toggle-btn ${info.state === 'busy' || info.state === 'buffer' ? 'btn-busy' : 'btn-free'}" onclick="toggleTable('${tbl.id}')">
              ${info.label}
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function toggleTable(tableId) {
      const sched = getLocalSchedule(currentSelectedDateIso);
      const willBeBusy = (sched[currentSelectedSlot]?.[tableId] !== 'busy');
      const idx = timeSlots.indexOf(currentSelectedSlot);
      timeSlots.slice(idx, idx + 3).forEach(s => {
        sched[s] = sched[s] || {};
        if (willBeBusy) sched[s][tableId] = 'busy';
        else delete sched[s][tableId];
      });
      localStorage.setItem('cokol_sched_' + currentSelectedDateIso, JSON.stringify(sched));
      renderTablesGrid();
    }

    function releaseTableEarly(tableId) {
      if (!confirm("Освободить стол досрочно?")) return;
      const sched = getLocalSchedule(currentSelectedDateIso);
      const idx = timeSlots.indexOf(currentSelectedSlot);
      timeSlots.slice(idx).forEach(s => {
        if (sched[s]) delete sched[s][tableId];
      });
      localStorage.setItem('cokol_sched_' + currentSelectedDateIso, JSON.stringify(sched));
      
      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      local.forEach(b => {
        if (b.tableId === tableId && b.dateIso === currentSelectedDateIso) b.status = 'completed';
      });
      localStorage.setItem('cokol_bookings', JSON.stringify(local));
      syncEverything();
    }

    function loadBookingsFeed() {
      const feed = document.getElementById('bookingsFeed');
      let bookings = [];
      try {
        const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
        bookings = local.filter(b => b.dateIso === currentSelectedDateIso || (b.date && b.date.includes(currentSelectedDateIso.slice(-2))));
      } catch(e) {}

      document.getElementById('bookingsCountBadge').innerText = `${bookings.length} записей`;
      if (!bookings.length) {
        feed.innerHTML = '<div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 12px;">На этот день броней пока нет</div>';
        return;
      }

      feed.innerHTML = '';
      bookings.forEach(b => {
        const card = document.createElement('div');
        card.className = 'booking-feed-card';
        card.innerHTML = `
          <div class="bfc-head">
            <span>${b.tableName || b.table_name} • ${b.time} – ${b.endTime || b.end_time || '1.5 ч'}</span>
            <span class="b-badge ${b.status === 'confirmed' ? 'badge-confirmed' : (b.status === 'completed' ? 'badge-completed' : 'badge-pending')}">${b.status}</span>
          </div>
          <div class="bfc-sub">👤 <strong>${b.name}</strong> (${b.phone})<br>💨 ${b.hookahs || 1} кальян [${b.hookahType || 'Классика'}]</div>
          <div class="bfc-foot"><span>Чек: <strong>${b.total || b.total_price}</strong></span></div>
          <div class="bfc-actions-bar">
            <button class="bf-act-btn bf-btn-seat" onclick="setBookingStatus('${b.id}', 'seated')">🛋 В зал</button>
            <button class="bf-act-btn bf-btn-extend" onclick="extendBooking('${b.id}')">⏱ Продлить (+1.5 ч)</button>
            <button class="bf-act-btn bf-btn-finish" onclick="openCloseModal('${b.id}')">🏁 Закрыть счёт</button>
            <button class="bf-act-btn bf-btn-cancel" onclick="setBookingStatus('${b.id}', 'rejected')">❌ Отмена</button>
          </div>
        `;
        feed.appendChild(card);
      });
    }

    function setBookingStatus(id, st) {
      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      local.forEach(b => { if (b.id === id) b.status = st; });
      localStorage.setItem('cokol_bookings', JSON.stringify(local));
      syncEverything();
    }

    function extendBooking(id) {
      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      const b = local.find(x => x.id === id);
      if (!b) return;
      const [h, m] = (b.endTime || '18:30').split(':').map(Number);
      const newEnd = `${String(Math.floor((h*60+m+90)/60)%24).padStart(2,'0')}:${String((h*60+m+90)%60).padStart(2,'0')}`;
      b.endTime = newEnd;
      b.totalNum = (b.totalNum || 1500) + 1500;
      b.total = `${b.totalNum} ₽`;
      b.hookahs = (b.hookahs || 1) + 1;
      localStorage.setItem('cokol_bookings', JSON.stringify(local));
      alert(`Стол продлен до ${newEnd}!`);
      syncEverything();
    }

    function openCloseModal(id) {
      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      activeClosingBooking = local.find(x => x.id === id);
      if (!activeClosingBooking) return;
      document.getElementById('closeVisitGuestDesc').innerHTML = `Гость: <strong>${activeClosingBooking.name}</strong> (${activeClosingBooking.phone})`;
      document.getElementById('closeVisitTotalInput').value = activeClosingBooking.totalNum || 1500;
      document.getElementById('closeVisitModal').style.display = 'flex';
    }

    function submitCloseVisit() {
      const val = parseFloat(document.getElementById('closeVisitTotalInput').value);
      if (!val || !activeClosingBooking) return;
      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      local.forEach(b => {
        if (b.id === activeClosingBooking.id) {
          b.status = 'completed';
          b.totalNum = val;
          b.total = `${val} ₽`;
        }
      });
      localStorage.setItem('cokol_bookings', JSON.stringify(local));
      document.getElementById('closeVisitModal').style.display = 'none';
      alert(`Счёт на ${val} ₽ закрыт, кэшбэк начислен!`);
      syncEverything();
    }

    function populateManualModal() {
      const tSel = document.getElementById('manTable');
      const sSel = document.getElementById('manTime');
      tSel.innerHTML = '';
      sSel.innerHTML = '';
      tableDefs.forEach(t => tSel.innerHTML += `<option value="${t.id}">${t.name}</option>`);
      timeSlots.forEach(s => sSel.innerHTML += `<option value="${s}" ${s==='18:00'?'selected':''}>${s}</option>`);
    }

    function openManualBookingModal() {
      document.getElementById('manualBookingModal').style.display = 'flex';
    }

    function submitManualBooking() {
      const name = document.getElementById('manName').value.trim();
      const phone = document.getElementById('manPhone').value.trim();
      const tid = document.getElementById('manTable').value;
      const time = document.getElementById('manTime').value;
      if (!name || !phone) { alert("Заполните имя и телефон!"); return; }

      const tbl = tableDefs.find(t => t.id === tid);
      const [h, m] = time.split(':').map(Number);
      const end = `${String(Math.floor((h*60+m+90)/60)%24).padStart(2,'0')}:${String((h*60+m+90)%60).padStart(2,'0')}`;

      const rec = {
        id: 'b_man_' + Date.now(),
        name: name,
        phone: phone,
        tableId: tid,
        tableName: tbl ? tbl.name : 'Стол',
        time: time,
        endTime: end,
        date: document.getElementById('currentDateLabel').innerText,
        dateIso: currentSelectedDateIso,
        hookahs: 1,
        hookahType: 'Классика',
        total: '1 500 ₽',
        totalNum: 1500,
        status: 'confirmed'
      };

      const local = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      local.unshift(rec);
      localStorage.setItem('cokol_bookings', JSON.stringify(local));

      const sched = getLocalSchedule(currentSelectedDateIso);
      const idx = timeSlots.indexOf(time);
      timeSlots.slice(idx, idx + 3).forEach(s => {
        sched[s] = sched[s] || {};
        sched[s][tid] = 'busy';
      });
      localStorage.setItem('cokol_sched_' + currentSelectedDateIso, JSON.stringify(sched));

      document.getElementById('manualBookingModal').style.display = 'none';
      syncEverything();
      alert("Бронь по звонку добавлена!");
    }

    function clearLegacyTests() {
      if (!confirm("Очистить все тестовые данные?")) return;
      localStorage.removeItem('cokol_bookings');
      for (let i = localStorage.length - 1; i >= 0; i--) {
        const k = localStorage.key(i);
        if (k && k.startsWith('cokol_sched_')) localStorage.removeItem(k);
      }
      syncEverything();
      alert("Очищено!");
    }

    function syncEverything() {
      renderTablesGrid();
      loadBookingsFeed();
    }
  </script>
</body>
</html>
