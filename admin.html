<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ЦОКОЛЬ Lounge | Панель администратора</title>

  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #12141a;
      --surface-hover: #181b24;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.14);
      --accent: #d62839;
      --accent-soft: rgba(214, 40, 57, 0.15);
      --green: #2ecc71;
      --green-soft: rgba(46, 204, 113, 0.15);
      --gold: #d4af37;
      --text: #f4f5f7;
      --text-muted: #7b808e;
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; }
    .container { max-width: 480px; margin: 0 auto; padding: 18px 16px; }

    /* Экран входа по паролю */
    .pin-overlay {
      position: fixed; inset: 0; background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px;
    }
    .pin-card {
      background: var(--surface); border: 1px solid var(--border-light);
      border-radius: 20px; padding: 26px 20px; max-width: 340px; width: 100%;
      text-align: center; box-shadow: 0 16px 36px rgba(0,0,0,0.6);
    }
    .pin-icon {
      width: 50px; height: 50px; border-radius: 50%;
      background: var(--accent-soft); border: 1px solid var(--accent);
      color: var(--accent); font-size: 20px; display: flex;
      align-items: center; justify-content: center; margin: 0 auto 14px;
    }
    .pin-card h2 { font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
    .pin-card p { font-size: 12px; color: var(--text-muted); margin-bottom: 18px; }
    .pin-input {
      width: 100%; background: var(--bg); border: 1px solid var(--border-light);
      border-radius: 10px; padding: 12px; color: #fff; font-size: 15px;
      text-align: center; outline: none; margin-bottom: 12px; transition: 0.2s;
    }
    .pin-input:focus { border-color: var(--accent); }
    .pin-btn {
      width: 100%; background: var(--accent); color: #fff; border: none;
      padding: 12px; border-radius: 10px; font-size: 13px; font-weight: 700;
      cursor: pointer; text-transform: uppercase; letter-spacing: 0.04em;
    }
    .pin-error { font-size: 11px; color: var(--accent); margin-top: 8px; display: none; }

    /* Шапка админки */
    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .admin-header h1 { font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; }
    .admin-header h1 span { color: var(--accent); }
    .logout-btn {
      background: var(--surface); border: 1px solid var(--border);
      color: var(--text-muted); padding: 5px 10px; border-radius: 6px;
      font-size: 11px; font-weight: 600; cursor: pointer;
    }

    /* Блок тайм-слотов */
    .section-title {
      font-size: 11px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .slots-scroll {
      display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px;
      margin-bottom: 18px; scrollbar-width: none;
    }
    .slots-scroll::-webkit-scrollbar { display: none; }
    .slot-pill {
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
      color: var(--text-muted); white-space: nowrap; flex-shrink: 0; cursor: pointer;
    }
    .slot-pill.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 700; }

    /* Карточки столов в шахматке */
    .tables-grid { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
    .table-admin-card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 12px; padding: 12px 14px; display: flex;
      justify-content: space-between; align-items: center; transition: 0.2s;
    }
    .table-admin-card.busy { border-color: rgba(214, 40, 57, 0.4); background: rgba(214, 40, 57, 0.04); }
    .table-info h4 { font-size: 13px; font-weight: 700; color: #fff; }
    .table-info p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    
    .status-toggle-btn {
      padding: 8px 14px; border-radius: 8px; font-size: 11px; font-weight: 700;
      letter-spacing: 0.04em; text-transform: uppercase; cursor: pointer; border: none;
      transition: 0.2s; min-width: 110px; text-align: center;
    }
    .btn-free { background: var(--green-soft); color: var(--green); border: 1px solid rgba(46, 204, 113, 0.3); }
    .btn-busy { background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(214, 40, 57, 0.4); }

    /* Секция ленты броней */
    .bookings-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px;
    }
    .booking-item {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
    }
    .booking-item:last-child { margin-bottom: 0; }
    .b-head { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
    .b-desc { font-size: 11px; color: var(--text-muted); line-height: 1.4; }
    .b-badge { font-size: 9px; padding: 2px 6px; border-radius: 4px; text-transform: uppercase; font-weight: 800; }
    .badge-pending { background: rgba(241, 196, 15, 0.15); color: #f1c40f; }
    .badge-confirmed { background: var(--green-soft); color: var(--green); }
  </style>
</head>
<body>

  <!-- Экран блокировки паролем -->
  <div class="pin-overlay" id="pinOverlay">
    <div class="pin-card">
      <div class="pin-icon">🔒</div>
      <h2>ЦОКОЛЬ Admin</h2>
      <p>Введите рабочий пароль смены для доступа к шахматке зала</p>
      <input type="password" id="pinInput" class="pin-input" placeholder="Пароль администратора" autofocus>
      <button class="pin-btn" onclick="checkPin()">Войти в панель</button>
      <div class="pin-error" id="pinError">Неверный пароль администратора</div>
    </div>
  </div>

  <div class="container" id="adminApp" style="display: none;">
    <!-- Шапка -->
    <div class="admin-header">
      <div>
        <h1>ЦОКОЛЬ<span>.</span> Шахматка</h1>
        <div style="font-size: 11px; color: var(--green);">● Смена открыта</div>
      </div>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <!-- Выбор времени -->
    <div class="section-title">
      <span>1. Выберите слот времени</span>
      <span id="currentSlotLabel" style="color: var(--accent); font-weight: 800;">18:00</span>
    </div>
    <div class="slots-scroll" id="slotsContainer"></div>

    <!-- Сетка столов -->
    <div class="section-title">
      <span>2. Состояние столов на выбранный слот</span>
      <span style="font-size: 10px; color: var(--text-muted);">Кликните для смены</span>
    </div>
    <div class="tables-grid" id="tablesContainer"></div>

    <!-- Лента броней -->
    <div class="section-title" style="margin-top: 10px;">
      <span>3. Последние брони из бота</span>
      <button onclick="loadBookingsFeed()" style="background: none; border: none; color: var(--accent); font-size: 10px; font-weight: 700; cursor: pointer;">Обновить ↺</button>
    </div>
    <div class="bookings-box" id="bookingsFeed">
      <div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px;">Нет активных броней</div>
    </div>
  </div>

  <script>
    const ADMIN_PIN = "tcklbel723daqw";
    const syncChannel = new BroadcastChannel('cokol_bookings_sync');

    const tableDefs = [
      { id: 'vip1', name: 'VIP 1 Малая', desc: 'PS5 • До 4 персон (Депозит 2 000 ₽)' },
      { id: 'vip2', name: 'VIP 2 Большая', desc: 'PS5 • До 8 персон (Депозит 2 000 ₽)' },
      { id: 't1', name: 'Стол №1', desc: 'У экрана • Красный диван + 2 стула' },
      { id: 't2', name: 'Стол №2', desc: 'Центр зала • Красный диван + 2 стула' },
      { id: 't3', name: 'Стол №3', desc: 'Уютный угол • Красный диван + 2 стула' },
      { id: 't4', name: 'Стол №4', desc: 'Перед экраном • Двухсторонние диваны' },
      { id: 't5', name: 'Стол №5', desc: 'Центр зала • Большой стол' },
      { id: 't6', name: 'Стол №6', desc: 'Зона у бара • 2 стула + диван' }
    ];

    const timeSlots = [
      '12:00', '12:30', '13:00', '13:30', '14:00', '14:30',
      '15:00', '15:30', '16:00', '16:30', '17:00', '17:30',
      '18:00', '18:30', '19:00', '19:30', '20:00', '20:30',
      '21:00', '21:30', '22:00', '22:30', '23:00', '23:30',
      '00:00', '00:30', '01:00'
    ];

    let currentSelectedSlot = '18:00';

    // Вход по паролю
    function checkPin() {
      const val = document.getElementById('pinInput').value.trim();
      if (val === ADMIN_PIN) {
        sessionStorage.setItem('cokol_admin_auth', 'ok');
        document.getElementById('pinOverlay').style.display = 'none';
        document.getElementById('adminApp').style.display = 'block';
        initAdminPanel();
      } else {
        document.getElementById('pinError').style.display = 'block';
      }
    }

    document.getElementById('pinInput').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPin();
    });

    function logout() {
      sessionStorage.removeItem('cokol_admin_auth');
      location.reload();
    }

    // Проверка сохранённой авторизации
    if (sessionStorage.getItem('cokol_admin_auth') === 'ok') {
      document.getElementById('pinOverlay').style.display = 'none';
      document.getElementById('adminApp').style.display = 'block';
      window.onload = initAdminPanel;
    }

    function initAdminPanel() {
      renderSlotPills();
      renderTablesGrid();
      loadBookingsFeed();
    }

    function renderSlotPills() {
      const container = document.getElementById('slotsContainer');
      container.innerHTML = '';
      timeSlots.forEach(time => {
        const btn = document.createElement('div');
        btn.className = `slot-pill ${time === currentSelectedSlot ? 'active' : ''}`;
        btn.innerText = time;
        btn.onclick = () => {
          currentSelectedSlot = time;
          document.getElementById('currentSlotLabel').innerText = time;
          renderSlotPills();
          renderTablesGrid();
        };
        container.appendChild(btn);
      });
    }

    function getSlotState(time) {
      try {
        return JSON.parse(localStorage.getItem('cokol_tables_' + time)) || {};
      } catch (e) {
        return {};
      }
    }

    function renderTablesGrid() {
      const container = document.getElementById('tablesContainer');
      container.innerHTML = '';
      const state = getSlotState(currentSelectedSlot);

      tableDefs.forEach(tbl => {
        const isBusy = (state[tbl.id] === 'busy');
        const card = document.createElement('div');
        card.className = `table-admin-card ${isBusy ? 'busy' : ''}`;

        card.innerHTML = `
          <div class="table-info">
            <h4>${tbl.name}</h4>
            <p>${tbl.desc}</p>
          </div>
          <button class="status-toggle-btn ${isBusy ? 'btn-busy' : 'btn-free'}" onclick="toggleTableStatus('${tbl.id}')">
            ${isBusy ? '🔴 ЗАНЯТ' : '🟢 СВОБОДЕН'}
          </button>
        `;
        container.appendChild(card);
      });
    }

    function toggleTableStatus(tableId) {
      const state = getSlotState(currentSelectedSlot);
      if (state[tableId] === 'busy') {
        delete state[tableId];
      } else {
        state[tableId] = 'busy';
      }
      localStorage.setItem('cokol_tables_' + currentSelectedSlot, JSON.stringify(state));
      syncChannel.postMessage({ type: 'table_state_changed', time: currentSelectedSlot });
      renderTablesGrid();
    }

    syncChannel.onmessage = (event) => {
      if (event.data?.type === 'table_state_changed' || event.data?.type === 'new_booking') {
        renderTablesGrid();
        loadBookingsFeed();
      }
    };

    function loadBookingsFeed() {
      const box = document.getElementById('bookingsFeed');
      let bookings = [];
      try {
        bookings = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      } catch (e) {}

      if (bookings.length === 0) {
        box.innerHTML = '<div style="font-size: 11px; color: var(--text-muted); text-align: center; padding: 10px;">Нет активных броней</div>';
        return;
      }

      box.innerHTML = '';
      bookings.slice(0, 10).forEach(b => {
        const item = document.createElement('div');
        item.className = 'booking-item';
        const isPending = b.status === 'pending';
        item.innerHTML = `
          <div class="b-head">
            <span>${b.tableName} • ${b.time}</span>
            <span class="b-badge ${isPending ? 'badge-pending' : 'badge-confirmed'}">${isPending ? 'Ожидает СБП' : 'Подтверждён'}</span>
          </div>
          <div class="b-desc">
            👤 ${b.name} (${b.phone || 'без телефона'})<br>
            💨 ${b.hookahs || 1} кальян [${b.hookahType || 'Классика'}] • Чек: <strong>${b.total || '1 500 ₽'}</strong>
            ${b.comment ? `<br>💬 «${b.comment}»` : ''}
          </div>
        `;
        box.appendChild(item);
      });
    }
  </script>
</body>
</html>
