<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ЦОКОЛЬ Lounge | Панель управления</title>
  
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0c0f;
      --surface: #12141a;
      --surface-hover: #181b24;
      --border: rgba(255, 255, 255, 0.08);
      --border-light: rgba(255, 255, 255, 0.14);
      --accent: #d62839;
      --gold: #d4af37;
      --green: #2ecc71;
      --orange: #e67e22;
      --text: #f4f5f7;
      --text-muted: #7b808e;
      --font: 'Plus Jakarta Sans', -apple-system, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); padding-bottom: 40px; overflow-x: hidden; }
    .container { max-width: 480px; margin: 0 auto; padding: 18px 16px; }

    .admin-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
    }
    .admin-title h1 { font-size: 17px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.06em; }
    .admin-title h1 span { color: var(--accent); }
    .admin-title p { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
    .nav-back-link {
      background: var(--surface); border: 1px solid var(--border-light); color: #fff;
      padding: 6px 10px; border-radius: 8px; font-size: 11px; font-weight: 700; text-decoration: none;
    }

    /* Metrics */
    .metrics-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
    .metric-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; }
    .metric-card span { font-size: 9px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; display: block; margin-bottom: 4px; }
    .metric-card strong { font-size: 15px; font-weight: 800; color: #fff; }

    /* Tabs */
    .tab-pills { display: flex; gap: 6px; background: var(--surface); padding: 4px; border-radius: 12px; margin-bottom: 16px; border: 1px solid var(--border); }
    .tab-btn { flex: 1; background: transparent; border: none; color: var(--text-muted); padding: 9px 0; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: var(--accent); color: #fff; }

    /* Slot Picker */
    .slot-picker-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px; margin-bottom: 14px; }
    .slot-label { font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; display: flex; justify-content: space-between; }
    .time-selector-row { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
    .time-selector-row::-webkit-scrollbar { display: none; }
    .admin-time-btn {
      background: var(--bg); border: 1px solid var(--border); color: var(--text-muted);
      padding: 7px 11px; border-radius: 8px; font-size: 11px; font-weight: 700; cursor: pointer; white-space: nowrap; flex-shrink: 0;
    }
    .admin-time-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    /* Tables Matrix */
    .tables-matrix { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .table-state-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
      padding: 14px 10px; text-align: center; cursor: pointer; transition: 0.2s; user-select: none;
    }
    .table-state-card:active { transform: scale(0.97); }
    .table-state-card h4 { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .table-state-card p { font-size: 10px; color: var(--text-muted); margin-bottom: 8px; }
    .table-state-badge { display: inline-block; font-size: 9px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 6px; }
    .st-free { background: rgba(46, 204, 113, 0.15); color: var(--green); border: 1px solid rgba(46, 204, 113, 0.3); }
    .st-busy { background: rgba(214, 40, 57, 0.15); color: var(--accent); border: 1px solid rgba(214, 40, 57, 0.3); }

    /* Bookings */
    .booking-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin-bottom: 10px; border-left: 4px solid var(--orange); }
    .booking-card.confirmed { border-left-color: var(--green); }
    .b-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .b-user h3 { font-size: 13px; font-weight: 800; color: #fff; }
    .b-user p { font-size: 10px; color: var(--text-muted); }
    .b-badge { font-size: 9px; font-weight: 800; padding: 3px 7px; border-radius: 5px; text-transform: uppercase; }
    .badge-pending { background: rgba(230, 126, 34, 0.15); color: var(--orange); }
    .badge-confirmed { background: rgba(46, 204, 113, 0.15); color: var(--green); }
    .b-details { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 11px; line-height: 1.5; color: #ccc; margin-bottom: 10px; }
    .b-actions { display: flex; gap: 8px; }
    .act-btn { flex: 1; padding: 8px; border-radius: 6px; font-size: 11px; font-weight: 700; border: none; cursor: pointer; text-align: center; }
    .act-confirm { background: var(--green); color: #fff; }

    .toast-box {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(18, 20, 26, 0.95); backdrop-filter: blur(10px);
      border: 1px solid var(--green); color: var(--green); padding: 10px 18px;
      border-radius: 10px; font-size: 12px; font-weight: 700; z-index: 1000;
      display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>

  <div class="container">
    <header class="admin-header">
      <div class="admin-title">
        <h1>ЦОКОЛЬ<span>.</span> ADMIN</h1>
        <p>Панель управления заведением</p>
      </div>
      <a href="index.html" class="nav-back-link">← В клиент</a>
    </header>

    <div class="metrics-grid">
      <div class="metric-card">
        <span>Депозиты</span>
        <strong id="mRevenue" style="color:var(--green)">0 ₽</strong>
      </div>
      <div class="metric-card">
        <span>Новые СБП</span>
        <strong id="mPending" style="color:var(--orange)">0</strong>
      </div>
      <div class="metric-card">
        <span>Всего броней</span>
        <strong id="mCount">0</strong>
      </div>
    </div>

    <div class="tab-pills">
      <button class="tab-btn active" onclick="switchTab('tables', this)">🛋 Зал и столы</button>
      <button class="tab-btn" onclick="switchTab('bookings', this)">📋 Брони гостей</button>
    </div>

    <!-- TAB 1: ТАБЛИЦА СТОЛОВ -->
    <div id="tabTables">
      <div class="slot-picker-box">
        <div class="slot-label">Слот времени: <strong id="currentSlotLabel" style="color:var(--accent);">18:00</strong></div>
        <div class="time-selector-row" id="timeSlotsBar"></div>
      </div>
      <div class="tables-matrix" id="tablesMatrixBox"></div>
    </div>

    <!-- TAB 2: СПИСОК БРОНЕЙ -->
    <div id="tabBookings" style="display: none;">
      <div id="bookingsFeed"></div>
    </div>
  </div>

  <div class="toast-box" id="toast">Обновлено!</div>

  <script>
    const rawTimes = [
      '12:00', '12:30', '13:00', '13:30', '14:00', '14:30',
      '15:00', '15:30', '16:00', '16:30', '17:00', '17:30',
      '18:00', '18:30', '19:00', '19:30', '20:00', '20:30',
      '21:00', '21:30', '22:00', '22:30', '23:00', '23:30',
      '00:00', '00:30'
    ];

    const tablesList = [
      { id: 'vip1', title: 'VIP 1', desc: 'Малая • до 4 чел' },
      { id: 'vip2', title: 'VIP 2', desc: 'Большая • до 8 чел' },
      { id: 't1', title: 'Стол №1', desc: 'Красный диван' },
      { id: 't2', title: 'Стол №2', desc: 'Красный диван' },
      { id: 't3', title: 'Стол №3', desc: 'Угол зала' },
      { id: 't4', title: 'Стол №4', desc: 'Перед экраном' },
      { id: 't5', title: 'Стол №5', desc: 'Центр зала' },
      { id: 't6', title: 'Стол №6', desc: 'У бара' }
    ];

    let selectedTime = '18:00';
    const syncChannel = new BroadcastChannel('cokol_bookings_sync');

    function getTableState(time) {
      const data = localStorage.getItem('cokol_tables_' + time);
      if (data) {
        try { return JSON.parse(data); } catch(e){}
      }
      return {};
    }

    function setTableState(time, state) {
      localStorage.setItem('cokol_tables_' + time, JSON.stringify(state));
      syncChannel.postMessage({ type: 'table_state_changed', time: time });
    }

    // Слушаем сигналы из клиента
    syncChannel.onmessage = (e) => {
      if (e.data?.type === 'new_booking') {
        showToast('🔔 Новая бронь: ' + e.data.booking.name);
        renderBookings();
        renderMatrix();
      } else if (e.data?.type === 'table_state_changed') {
        renderMatrix();
      }
    };
    window.addEventListener('storage', () => {
      renderBookings();
      renderMatrix();
    });

    function renderTimeSlots() {
      const bar = document.getElementById('timeSlotsBar');
      bar.innerHTML = '';
      rawTimes.forEach(t => {
        const btn = document.createElement('button');
        btn.className = `admin-time-btn ${t === selectedTime ? 'active' : ''}`;
        btn.innerText = t;
        btn.onclick = () => {
          selectedTime = t;
          document.getElementById('currentSlotLabel').innerText = t;
          renderTimeSlots();
          renderMatrix();
        };
        bar.appendChild(btn);
      });
    }

    function renderMatrix() {
      const box = document.getElementById('tablesMatrixBox');
      box.innerHTML = '';
      const state = getTableState(selectedTime);

      tablesList.forEach(tbl => {
        const isBusy = (state[tbl.id] === 'busy');
        const card = document.createElement('div');
        card.className = 'table-state-card';
        card.innerHTML = `
          <h4>${tbl.title}</h4>
          <p>${tbl.desc}</p>
          <span class="table-state-badge ${isBusy ? 'st-busy' : 'st-free'}">${isBusy ? 'Занят' : 'Свободен'}</span>
        `;

        card.onclick = () => {
          state[tbl.id] = isBusy ? 'free' : 'busy';
          setTableState(selectedTime, state);
          renderMatrix();
          showToast(`${tbl.title} теперь ${state[tbl.id] === 'busy' ? 'ЗАНЯТ' : 'СВОБОДЕН'} на ${selectedTime}`);
        };

        box.appendChild(card);
      });
    }

    function renderBookings() {
      const feed = document.getElementById('bookingsFeed');
      let bookings = [];
      try {
        bookings = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      } catch(e){}

      if (bookings.length === 0) {
        // Начальные тестовые данные для наглядности
        bookings = [
          {
            id: 'demo1',
            name: 'София',
            username: 'sofia_belgorod',
            phone: '+7 (980) 123-45-67',
            tableName: 'VIP 2 Большая (до 8 чел)',
            date: 'Сегодня',
            time: '20:00',
            hookahs: 2,
            hookahType: 'PREMIUM',
            total: '3 500 ₽',
            status: 'pending'
          }
        ];
        localStorage.setItem('cokol_bookings', JSON.stringify(bookings));
      }

      feed.innerHTML = '';
      let pendingCount = 0;
      let totalRevenue = 0;

      bookings.forEach(b => {
        const isConfirmed = (b.status === 'confirmed');
        if (!isConfirmed) pendingCount++;

        const numPrice = parseInt(b.total.replace(/[^0-9]/g, '')) || 0;
        totalRevenue += numPrice;

        const card = document.createElement('div');
        card.className = `booking-card ${isConfirmed ? 'confirmed' : ''}`;
        card.innerHTML = `
          <div class="b-head">
            <div class="b-user">
              <h3>${b.name}</h3>
              <p>@${b.username} • ${b.phone}</p>
            </div>
            <div class="b-badge ${isConfirmed ? 'badge-confirmed' : 'badge-pending'}">
              ${isConfirmed ? 'Подтверждено' : 'Проверка СБП'}
            </div>
          </div>
          <div class="b-details">
            📍 <strong>${b.tableName}</strong><br>
            ⏰ <strong>${b.date} • ${b.time}</strong><br>
            💨 <strong>${b.hookahs} кальян(а) [${b.hookahType}]</strong><br>
            💳 Депозит: <strong>${b.total}</strong>
          </div>
          <div class="b-actions">
            ${!isConfirmed ? `<button class="act-btn act-confirm" onclick="confirmBooking('${b.id}')">✓ Депозит поступил</button>` : `<button class="act-btn" style="background:#222;color:#777;cursor:default;">Оплачено</button>`}
          </div>
        `;
        feed.appendChild(card);
      });

      document.getElementById('mRevenue').innerText = totalRevenue.toLocaleString('ru-RU') + ' ₽';
      document.getElementById('mPending').innerText = pendingCount;
      document.getElementById('mCount').innerText = bookings.length;
    }

    function confirmBooking(id) {
      let bookings = JSON.parse(localStorage.getItem('cokol_bookings')) || [];
      const item = bookings.find(b => b.id === id);
      if (item) {
        item.status = 'confirmed';
        localStorage.setItem('cokol_bookings', JSON.stringify(bookings));
        renderBookings();
        showToast('Депозит подтверждён!');
      }
    }

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('tabTables').style.display = (tab === 'tables') ? 'block' : 'none';
      document.getElementById('tabBookings').style.display = (tab === 'bookings') ? 'block' : 'none';
    }

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2200);
    }

    renderTimeSlots();
    renderMatrix();
    renderBookings();
  </script>
</body>
</html>
